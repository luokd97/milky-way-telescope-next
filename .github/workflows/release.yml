name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Scan tracked files for secrets
        run: ./scripts/scan-secrets.sh

      - name: Test and package
        run: mvn --batch-mode verify

      - name: Create checksum
        run: |
          cd target
          sha256sum telescope-next.jar > telescope-next.jar.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            target/telescope-next.jar \
            target/telescope-next.jar.sha256 \
            --verify-tag \
            --generate-notes \
            --title "Telescope Next ${GITHUB_REF_NAME}"
