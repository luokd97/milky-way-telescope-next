server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8081}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

spring:
  application:
    name: telescope-next
  thymeleaf:
    cache: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

telescope:
  site-password: ${MONITOR_SITE_PASSWORD:}
  remember-me-key: ${MONITOR_REMEMBER_ME_KEY:}
  storage:
    settings-file: ${TELESCOPE_SETTINGS_FILE:data/settings.json}
  message:
    recent-limit: 100
    max-payload-bytes: 1048576
  state:
    recent-event-limit: ${TELESCOPE_RECENT_EVENT_LIMIT:50}
  inventory:
    highlight-limit: ${TELESCOPE_INVENTORY_HIGHLIGHT_LIMIT:12}
