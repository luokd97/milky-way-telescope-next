<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Settings · Telescope Next</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/admin/admin.js" defer></script>
</head>
<body>
<header class="site-header settings-header">
    <div class="site-header-copy">
        <h1>Settings</h1>
    </div>
    <nav>
        <a class="header-action" href="/" aria-label="Dashboard" title="Dashboard">
            <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 10.5 12 3l9 7.5"></path>
                <path d="M5 9.5V21h14V9.5"></path>
                <path d="M9 21v-6h6v6"></path>
            </svg>
        </a>
    </nav>
</header>
<main class="page-shell settings-layout settings-page">
    <section class="panel runtime-panel" aria-labelledby="connection-status-heading">
        <div class="panel-heading">
            <h2 id="connection-status-heading">Connections (<span id="connection-count">0</span>)</h2>
        </div>
        <p id="runtime-message" class="notice" hidden></p>
        <div id="connection-list" class="connection-list"></div>
    </section>

    <section class="panel config-panel" aria-labelledby="config-heading">
        <h2 id="config-heading">Configuration JSON</h2>
        <form id="config-form">
            <div class="config-editor is-locked">
                <textarea id="config-json" rows="30" spellcheck="false" required readonly
                    aria-label="Configuration JSON"
                    placeholder="Loading application configuration…"></textarea>
                <button id="unlock-config" class="config-editor-lock" type="button"
                    aria-controls="config-json">Tap to edit JSON</button>
            </div>
            <p id="config-message" class="notice" hidden></p>
            <div class="button-row">
                <button id="save-config" type="submit" disabled>Save</button>
                <button id="discard-config" class="button-secondary" type="button" disabled>Discard</button>
            </div>
        </form>
    </section>
</main>
<footer class="session-footer">
    <form method="post" action="/logout" id="logout-form">
        <button class="session-signout" type="submit">Sign out</button>
    </form>
</footer>
</body>
</html>
