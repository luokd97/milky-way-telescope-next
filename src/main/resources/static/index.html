<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Milky Way Telescope Next</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
</head>
<body>
<header class="site-header">
    <div class="site-header-copy">
        <h1>Telescope Next</h1>
        <p id="monitor-summary" class="header-summary">
            <span class="header-summary-item">Waiting for monitor data</span>
            <span class="header-summary-mobile">
                <span class="header-summary-mobile-text">Waiting</span>
            </span>
        </p>
    </div>
    <nav>
        <a class="settings-link" href="/settings" aria-label="Settings">
            <span class="settings-icon" aria-hidden="true">&#9881;&#xfe0e;</span>
            <span class="settings-label">Settings</span>
        </a>
    </nav>
</header>
<main class="page-shell">
    <section id="character-grid" class="character-grid" aria-live="polite"></section>

    <details id="diagnostics" class="diagnostics-panel">
        <summary>
            <span>
                <span class="eyebrow">Diagnostics</span>
                <strong>Recent messages</strong>
            </span>
            <span class="muted">Open protocol trace</span>
        </summary>
        <div class="diagnostics-body">
            <div class="panel-heading">
                <label class="diagnostic-character-field">
                    <span>Character</span>
                    <select id="diagnostic-character" aria-label="Diagnostic character"></select>
                </label>
                <span id="diagnostic-count" class="panel-meta">0 messages</span>
            </div>
            <div class="table-wrap">
                <table class="messages-table">
                    <thead>
                    <tr>
                        <th>Seq</th>
                        <th>Time</th>
                        <th>Bytes</th>
                        <th>Type</th>
                        <th>Summary</th>
                    </tr>
                    </thead>
                    <tbody id="diagnostic-messages"></tbody>
                </table>
            </div>
        </div>
    </details>
</main>
</body>
</html>
