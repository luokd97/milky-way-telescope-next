<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · Telescope Next</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="login-page">
<main class="login-card">
    <p class="eyebrow">Milky Way Telescope</p>
    <h1>Observer access</h1>
    <p class="muted">Enter the site password to open the private monitor.</p>
    <p class="notice error" th:if="${param.error}">Incorrect password.</p>
    <p class="notice" th:if="${param.logout}">Signed out.</p>
    <form method="post" action="/login">
        <input type="hidden" name="username" value="owner">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label>
            <span>Password</span>
            <input name="password" type="password" autocomplete="current-password" required autofocus>
        </label>
        <button type="submit">Sign in</button>
    </form>
</main>
</body>
</html>
